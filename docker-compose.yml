services:
  pathoverse-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: pathoverse-api

    ports:
      - "8000:8000"

    env_file:
      - .env.production

    environment:
      NVIDIA_VISIBLE_DEVICES: "0"

    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./logs:/app/logs

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/api/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
